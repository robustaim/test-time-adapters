[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-time-adapters"
version = "1.1.0rc1"
description = "Ready-to-Go Test-time Adaptation/Training Implementations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "robustaim" }]
keywords = ["test-time-adaptation", "domain-adaptation", "pytorch", "deep-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate",
    "transformers>=4.57.6",
    "timm>=1.0.22",
    "muon-optimizer>=0.1.0",

    "numpy>=2.4.1",
    "opencv-python ; platform_system != 'Linux'",
    "opencv-python-headless ; platform_system == 'Linux'",
    "supervision>=0.27.0",
    "torchinfo>=1.8.0",
    "cityscapesscripts>=2.2.4",
    "pycocotools>=2.0.11",
    "imagecorruptions>=1.1.2",
    "test-time-adapters-scalabel",
    "test-time-adapters-shift-dev",

    "ipykernel>=7.0.1",
    "ipywidgets>=8.1.8",
    "tqdm>=4.67.1",
    "gdown>=5.2.0",
    "hf-xet>=1.2.0",
    "filetype>=1.2.0",
]
[project.optional-dependencies]
detectron2 = [ "detectron2" ]
torch = [ "torch", "torchvision" ]
torch-cu128 = [ "torch", "torchvision" ]
wandb = [ "wandb>=0.23.1" ]


[project.urls]
Homepage = "https://github.com/robustaim/test-time-adapters"
Repository = "https://github.com/robustaim/test-time-adapters"

[tool.hatch.build.targets.wheel]
packages = ["ttadapters"]

[tool.hatch.build.targets.sdist]
only-include = ["ttadapters", "README.md", "LICENSE"]

[tool.uv.sources]
torch = [ { index = "torch-cu128" } ]
torchvision = [ { index = "torch-cu128" } ]
detectron2 = { git = "https://github.com/robustaim/detectron2" }

[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
